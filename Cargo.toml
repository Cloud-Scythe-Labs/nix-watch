[package]
name = "nix-watch"
description = "Nix Watch watches over your project's source for changes, and runs Nix commands when they occur."
version = "0.1.0"
license = "BSD-2-Clause"
readme = "README.md"
authors = ["CloudScytheLabs <cloudscythelabs@gmail.com>"]
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
env_logger = "0.11"
log = "0.4"
notify = "8.0"
